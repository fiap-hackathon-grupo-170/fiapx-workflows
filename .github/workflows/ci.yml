name: CI

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: '1.22.0'
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  quality:
    name: Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ inputs.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: 'go.mod'
          token: ${{ github.token }}
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install dependencies
        run: go mod download
      
      - name: Verify formatting
        run: |
          if [ "$(gofmt -l .)" ]; then
            echo "Code is not formatted"
            gofmt -l .
            exit 1
          fi

      # - name: Vet code
      #   run: go vet ./...

      - name: Run tests
        run: go test ./... -v -cover

      - name: Build
        run: go build ./...

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Validate New Coverage (70% for PR)
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MIN_COVERAGE=70

          echo "🔍 Verificando coverage do PR #$PR_NUMBER..."
          sleep 10

          RESPONSE=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ vars.SONAR_PROJECT_KEY }}&pullRequest=$PR_NUMBER")

          NEW_COVERAGE=$(echo "$RESPONSE" | jq -r '
            .projectStatus.conditions[] 
            | select(.metricKey == "new_coverage") 
            | .actualValue
          ')

          if [ -z "$NEW_COVERAGE" ] || [ "$NEW_COVERAGE" = "null" ]; then
            echo "⚠️  Métrica 'new_coverage' não disponível - ignorando validação"
            exit 0
          fi

          COVERAGE=$(printf "%.2f" "$NEW_COVERAGE")

          echo "📊 New Coverage: $COVERAGE%"
          echo "🎯 Mínimo: $MIN_COVERAGE%"

          if (( $(echo "$COVERAGE >= $MIN_COVERAGE" | bc -l) )); then
            echo "✅ Coverage OK ($COVERAGE% >= $MIN_COVERAGE%)"
            exit 0
          else
            echo "❌ Coverage insuficiente ($COVERAGE% < $MIN_COVERAGE%)"
            exit 1
          fi
